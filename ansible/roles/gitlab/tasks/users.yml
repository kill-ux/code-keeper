---
# tasks file for roles/gitlab
- name: Check if admin user exists
  ansible.builtin.command:
    cmd: >
      gitlab-rails runner "puts User.exists?(username: '{{ vault_gitlab_admin_username }}')"
  become: true
  register: admin_user_check
  changed_when: false

- name: Create dedicated admin user via Rails console
  ansible.builtin.command:
    cmd: >
      gitlab-rails runner "
        response = Users::CreateService.new(
          nil,
          username: '{{ vault_gitlab_admin_username }}',
          email: 'mustaphaboutoubdev@gmail.com',
          name: 'DevOps Admin',
          password: '{{ vault_gitlab_admin_password }}',
          password_confirmation: '{{ vault_gitlab_admin_password }}',
          admin: true,
          skip_confirmation: true
        ).execute;

        if response.error?
          raise Array(response.message).join(', ')
        end
      "
  become: true
  when: "'false' in admin_user_check.stdout"