stages:
  - build
  - test
  - scan
  - package
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .cache/pip

build_job:
  stage: build
  image: python:3.12-slim
  script:
    - pip install --upgrade pip setuptools wheel
    - pip install -r requirements.txt
    - pip install -r requirements-dev.txt
    - python3 -m compileall app/
  rules:
    - if: "$CI_COMMIT_REF_PROTECTED"

unit_test_job:
  stage: test
  image: python:3.12-slim
  script:
    - pip install -r requirements.txt
    - pip install -r requirements-dev.txt
    - pytest -v tests/unit --cov=app --cov-report=xml:coverage.xml --cov-report=term --junitxml=test-results.xml
  artifacts:
    paths:
      - coverage.xml
      - test-results.xml
    expire_in: 1h
  dependencies: []
  rules:
    - if: "$CI_COMMIT_REF_PROTECTED"

integration_test_job:
  stage: test
  script:
    - apk add --no-cache python3 py3-pip
    - pip install -r requirements.txt --break-system-packages
    - pip install -r requirements-dev.txt --break-system-packages
    - docker compose -f tests/integration/docker-compose.yml up -d --wait
    - pytest -v tests/integration
  after_script:
    - docker compose -f tests/integration/docker-compose.yml down --rmi local
  dependencies: []
  rules:
    - if: "$CI_COMMIT_REF_PROTECTED"

sonarqube-check:
  stage: scan
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar" 
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner
  rules:
    - if: "$CI_COMMIT_REF_PROTECTED"
    

trivy_dependency_scan:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy fs --quiet --scanners vuln,secret,misconfig --exit-code 1 .
  rules:
    - if: "$CI_COMMIT_REF_PROTECTED"

containerize_app:
  stage: package
  variables:
    DOCKERHUB_REPO: "$DOCKERHUB_USER/api-gateway"
  before_script:
    - echo "$DOCKERHUB_PASS" | docker login -u "$DOCKERHUB_USER" --password-stdin
  script:
    - TAG_ARGS="-t $DOCKERHUB_REPO:$CI_COMMIT_SHA -t $DOCKERHUB_REPO:latest"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        TAG_ARGS="$TAG_ARGS -t $DOCKERHUB_REPO:$CI_COMMIT_TAG"
      fi
    - docker build $TAG_ARGS .
    - docker push --all-tags $DOCKERHUB_REPO
  dependencies: []
  rules:
    - if: "$CI_COMMIT_REF_PROTECTED"

.deploy_ecs:
  stage: deploy
  image: heyvaldemar/aws-kubectl:latest

  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
    - when: never

  script:
    - |
      echo "=== Describing task definition ==="
      set -eu

      aws ecs describe-task-definition \
        --task-definition "$ECS_TASK_FAMILY" \
        --query 'taskDefinition' \
        --output json > "$TASK_DEF_JSON"

    - |
      echo "=== Updating container image ==="
      set -eu

      jq \
        --arg NAME "$CONTAINER_NAME" \
        --arg IMAGE "$IMAGE_URI" \
        '
        del(
          .taskDefinitionArn,
          .revision,
          .status,
          .requiresAttributes,
          .compatibilities,
          .registeredAt,
          .registeredBy,
          .deregisteredAt
        )
        | .containerDefinitions |= map(
            if .name == $NAME then .image = $IMAGE else . end
          )
        ' "$TASK_DEF_JSON" > "$NEW_TASK_DEF_JSON"

    - |
      echo "=== Registering task definition ==="
      set -eu

      TASK_DEF_ARN="$(
        aws ecs register-task-definition \
          --cli-input-json "file://$NEW_TASK_DEF_JSON" \
          --query 'taskDefinition.taskDefinitionArn' \
          --output text
      )"

      test -n "$TASK_DEF_ARN"
      export TASK_DEF_ARN

    - |
      echo "=== Updating ECS service ==="
      set -eu

      aws ecs update-service \
        --cluster "$ECS_CLUSTER" \
        --service "$ECS_SERVICE" \
        --task-definition "$TASK_DEF_ARN"

    - |
      echo "=== Waiting for ECS service stability ==="
      set -eu

      aws ecs wait services-stable \
        --cluster "$ECS_CLUSTER" \
        --services "$ECS_SERVICE"

deploy_staging:
  extends: .deploy_ecs
  variables:
    ENVIRONMENT: staging
    TASK_NAME: api-gateway
    ECS_CLUSTER: cloud-design-cluster-${ENVIRONMENT}
    ECS_SERVICE: ${TASK_NAME}-service-${ENVIRONMENT}
    ECS_TASK_FAMILY: ${TASK_NAME}-${ENVIRONMENT}
    CONTAINER_NAME: ${TASK_NAME}
    IMAGE_URI: ${DOCKERHUB_USER}/${TASK_NAME}:${CI_COMMIT_SHA}
    TASK_DEF_JSON: task-definition.json
    NEW_TASK_DEF_JSON: new-task-definition.json

deploy_production:
  extends: .deploy_ecs
  variables:
    ENVIRONMENT: prod
    TASK_NAME: api-gateway
    ECS_CLUSTER: cloud-design-cluster-${ENVIRONMENT}
    ECS_SERVICE: ${TASK_NAME}-service-${ENVIRONMENT}
    ECS_TASK_FAMILY: ${TASK_NAME}-${ENVIRONMENT}
    CONTAINER_NAME: ${TASK_NAME}
    IMAGE_URI: ${DOCKERHUB_USER}/${TASK_NAME}:${CI_COMMIT_SHA}
    TASK_DEF_JSON: task-definition.json
    NEW_TASK_DEF_JSON: new-task-definition.json
